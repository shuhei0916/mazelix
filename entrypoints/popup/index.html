<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mazelix</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        font-size: 14px;
      }
      input {
        grid-column: 1 / -1;
        width: 100%;
      }
      output {
        grid-row: 1;
        grid-column: 2;
        font-variant-numeric: tabular-nums;
        font-weight: bold;
      }
      p {
        margin: 12px 0 0;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <h1>mazelix</h1>
    <div id="ratio"></div>
    <p>Netflix の字幕を、この割合で英語にします。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
